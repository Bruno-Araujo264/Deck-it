info:
  name: Listar Cartas (Catálogo)
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/cards?gameId=1&name=Lotus&rarity=mythic&page=3&limit=10"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: gameId
      value: "1"
      type: query
    - name: name
      value: Lotus
      type: query
    - name: rarity
      value: mythic
      type: query
    - name: page
      value: "3"
      type: query
    - name: limit
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
